<section class="container album-page py-2">
  <div id="album-summary"></div>
  <div id="album-sync"></div>
  <div class="album-toolbar d-flex gap-2 align-items-center my-2">
    <input
      id="album-search"
      type="search"
      class="form-control form-control-sm"
      placeholder="Find a stamp..."
    />
    <select id="album-filter" class="form-select form-select-sm album-filter">
      <option value="all">All pages</option>
      <option value="incomplete">Incomplete</option>
      <option value="unsynced">Not synced</option>
    </select>
  </div>
  <div id="album-list"></div>
</section>
